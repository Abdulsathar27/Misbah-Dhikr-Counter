# Regenerate the app icons with: flutter pub run flutter_launcher_icons
# Afterwards run `flutter test`: the tool also overwrites an unrelated iOS build
# setting, and test/ios_project_test.dart fails if it did. Set that setting back
# to YES in ios/Runner.xcodeproj/project.pbxproj.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#08392F"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    background_color: "#171B20"
    theme_color: "#171B20"

  windows:
    generate: true
    icon_size: 256

  macos:
    generate: true
